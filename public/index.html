<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>AI Tech Treasure Hunt</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#14182b;--mu:#667;--ac:#5b3df5;--ok:#12a150;--bad:#d93025;--bd:#dfe3ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#181c30;--tx:#eef0fa;--mu:#9aa0bd;--ac:#8b78ff;--bd:#2a3050}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#181c30;--tx:#eef0fa;--mu:#9aa0bd;--ac:#8b78ff;--bd:#2a3050}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px}h1{font-size:22px;margin:8px 0}h2{font-size:18px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
input{width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);margin:6px 0;font-size:16px}
button,.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block}
button.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.on{background:var(--ac);color:#fff}
.opt{display:block;width:100%;text-align:left;margin:6px 0;background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.code{font:700 28px monospace;letter-spacing:2px;color:var(--ac)}.mu{color:var(--mu);font-size:14px}
.ok{color:var(--ok)}.bad{color:var(--bad)}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px;vertical-align:top}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.scroll{overflow-x:auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.clue{border-left:4px solid var(--ac);padding:8px 12px;background:var(--bg);border-radius:6px}
</style></head><body><div class="w" id="app">Loading…</div>
<script>
const MAXM=3,TOTAL=5;
const $=s=>document.querySelector(s),app=$("#app"),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS={g(k){try{return localStorage.getItem(k)}catch(e){return null}},s(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
async function api(p,method="GET",body){try{const h={"Content-Type":"application/json"};const t=LS.g("adm");if(t)h.Authorization="Bearer "+t;
 const r=await fetch(p,{method,headers:h,body:body?JSON.stringify(body):undefined});const j=await r.json();j._s=r.status;return j}catch(e){return{error:"Network error. Check your internet and try again.",_s:0}}}
const fmt=t=>t?new Date(t).toLocaleTimeString():"-";
let timer=null,tab="teams";
function shell(inner,nav=true){app.innerHTML=`<h1>🤖 AI Tech Treasure Hunt</h1>${nav?`<nav><a class="btn s" style="color:var(--tx)" href="#/register">Register</a><a class="btn s" style="color:var(--tx)" href="#/start">Start / Continue</a><a class="btn s" style="color:var(--tx)" href="#/admin">Admin</a></nav>`:""}${inner}`}
async function route(){clearInterval(timer);const h=location.hash.slice(1)||"/register";
 if(h==="/register")return reg();if(h==="/start")return start();if(h==="/team")return teamPage();
 if(h.startsWith("/cp/"))return checkpoint(h.slice(4));if(h==="/admin")return LS.g("adm")?dash():login();reg()}
function reg(){shell(`<div class="card"><h2>Register your team</h2><input id="tn" placeholder="Team name" maxlength="40"><p class="mu">Team members (max ${MAXM})</p>${Array.from({length:MAXM},(_,i)=>`<input class="mb" maxlength="40" placeholder="Member ${i+1} name${i?" (optional)":""}">`).join("")}<p id="err" class="bad"></p><button id="go">Register</button></div>`);
 $("#go").onclick=async()=>{const r=await api("/api/register","POST",{name:$("#tn").value,members:[...document.querySelectorAll(".mb")].map(i=>i.value)});
  if(r.error)return $("#err").textContent=r.error;
  shell(`<div class="card"><h2 class="ok">Team registered ✅</h2><p>${esc(r.name)}</p><p>Your team code (save it / take a screenshot!):</p><div class="code">${r.code}</div><p class="mu">Enter this code at the start link to begin the hunt.</p><a class="btn" href="#/start">Go to Start</a></div>`)}}
function start(){shell(`<div class="card"><h2>Enter your team code</h2><input id="c" placeholder="AIH-XXXX" style="text-transform:uppercase" value="${esc(LS.g("code")||"")}"><p id="err" class="bad"></p><button id="go">Start hunt</button></div>`);
 $("#go").onclick=async()=>{const code=$("#c").value.trim().toUpperCase(),r=await api("/api/start","POST",{code});
  if(r.error)return $("#err").textContent=r.error;LS.s("code",code);location.hash="#/team"}}
async function teamPage(){const code=LS.g("code");if(!code)return start();const t=await api("/api/team?code="+encodeURIComponent(code));if(t.error){LS.s("code",null);return start()}
 if(!t.started)return shell(`<div class="card"><h2>${esc(t.name)}</h2><p>You haven't started yet.</p><a class="btn" href="#/start">Start hunt</a></div>`,false);
 shell(`<div class="card"><h2>${esc(t.name)}</h2><div class="bar"><i style="width:${t.progress/TOTAL*100}%"></i></div><p>Progress: <b>${t.progress}/${TOTAL}</b> checkpoints</p>
 ${t.finishedAt?`<h2 class="ok">${t.winner?"🏆 You are the WINNER!":"🎉 You finished all checkpoints!"}</h2><p class="mu">Finished at ${fmt(t.finishedAt)}</p>`:`<p>Next clue:</p><div class="clue">${esc(t.clue)}</div><p class="mu">Reach the location, scan the QR code there and answer the question.</p>`}</div>`,false)}
async function checkpoint(tok){const code=LS.g("code");const r=await api(`/api/cp?token=${encodeURIComponent(tok)}&code=${encodeURIComponent(code||"")}`);
 const msg=(h,t,b="")=>shell(`<div class="card"><h2 class="${b}">${h}</h2><p>${t}</p><a class="btn" href="#/team">My clue / progress</a></div>`,false);
 if(r.status==="invalid")return msg("Invalid link","This checkpoint link is not valid.","bad");
 if(r.status==="nocode")return shell(`<div class="card"><p>Enter your team code first.</p><a class="btn" href="#/start">Enter code</a></div>`,false);
 if(r.status==="notstarted")return msg("Not started","Your team hasn't started the hunt yet.","bad");
 if(r.status==="finished")return teamPage();
 if(r.status==="done")return msg("Already completed ✔️","You've already completed this checkpoint.");
 if(r.status==="wrong")return msg("Not your next checkpoint ❌","Follow your own clue to find the right location.","bad");
 if(r.status!=="ok")return msg("Oops",esc(r.error||"Something went wrong."),"bad");
 shell(`<div class="card"><h2>Checkpoint reached 📍</h2><p><b>${esc(r.q)}</b></p>${r.o.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}<p id="err" class="bad"></p></div>`,false);
 document.querySelectorAll(".opt").forEach(b=>b.onclick=async()=>{const a=await api("/api/answer","POST",{code,token:tok,choice:+b.dataset.i});
  if(a.error)return $("#err").textContent=a.error;if(!a.correct)return $("#err").textContent="Wrong answer, try again!";
  if(a.finished)shell(`<div class="card"><h2 class="ok">Correct! 🎉 All checkpoints done!</h2><p>${a.winner?"🏆 You are the WINNER (first to finish)!":"You finished the hunt. Check with the coordinator for the final result."}</p></div>`,false);
  else shell(`<div class="card"><h2 class="ok">Correct! ✅</h2><p>Checkpoint ${a.progress}/${TOTAL} done. Your next clue:</p><div class="clue">${esc(a.nextClue)}</div><br><a class="btn" href="#/team">Back to my progress</a></div>`,false)})}
function login(){shell(`<div class="card"><h2>Coordinator login</h2><input id="u" placeholder="Email / username"><input id="p" type="password" placeholder="Password"><p id="err" class="bad"></p><button id="go">Login</button></div>`);
 $("#go").onclick=async()=>{const r=await api("/api/admin/login","POST",{user:$("#u").value.trim(),pass:$("#p").value});if(r.token){LS.s("adm",r.token);route()}else $("#err").textContent=r.error}}
async function dash(){const d=await api("/api/admin/teams");if(d._s===401){LS.s("adm",null);return login()}
 const ts=d.teams||[];const btn=(k,l)=>`<button class="${tab===k?"on":"s"}" data-t="${k}">${l}</button>`;let body="";
 if(tab==="teams")body=ts.length?`<p class="mu">${ts.length} team(s) registered</p><div class="scroll"><table><tr><th>Team</th><th>Code</th><th>Members</th><th>Registered</th></tr>${ts.map(t=>`<tr><td>${esc(t.name)}</td><td>${t.code}</td><td>${t.members.map(esc).join(", ")}</td><td>${fmt(t.createdAt)}</td></tr>`).join("")}</table></div>`:"<p>No teams yet.</p>";
 if(tab==="progress"){const r=[...ts].sort((a,b)=>(a.finishedAt||9e15)-(b.finishedAt||9e15)||b.progress-a.progress);
  body=`<div class="scroll"><table><tr><th>Team</th><th>Stage</th><th>Route</th><th>Started</th><th>Finished</th></tr>${r.map(t=>`<tr><td>${t.winner?"🏆 ":""}${esc(t.name)}</td><td>${t.route?t.progress+"/"+d.total:"Not started"}</td><td>${t.route?t.route.join("-"):"-"}</td><td>${fmt(t.startedAt)}</td><td>${fmt(t.finishedAt)}</td></tr>`).join("")}</table></div><p class="mu">Auto-refreshes every 5 seconds.</p>`}
 if(tab==="links"){const l=(await api("/api/admin/links")).links||[];const o=location.origin;
  body=`<div class="grid">${l.map(c=>`<div class="card"><b>Checkpoint ${c.id}</b><div class="qr" data-u="${o}/#/cp/${c.token}" style="margin:8px 0"></div><div class="mu" style="word-break:break-all">${o}/#/cp/${c.token}</div></div>`).join("")}</div><p class="mu">Print this page (Ctrl+P) and place one QR at each location. Start link: ${o}/#/start</p>`}
 shell(`<div class="card"><nav>${btn("teams","Registered Teams")}${btn("progress","Team Progress")}${btn("links","Checkpoint Links / QR")}<button class="s" id="lo">Logout</button></nav>${body}</div>`,false);
 document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;dash()});
 $("#lo").onclick=()=>{LS.s("adm",null);route()};
 document.querySelectorAll(".qr").forEach(e=>{try{new QRCode(e,{text:e.dataset.u,width:150,height:150})}catch(x){e.textContent="QR unavailable"}});
 if(tab==="progress")timer=setInterval(()=>{if(location.hash==="#/admin")dash()},5000)}
window.addEventListener("hashchange",route);route();
</script></body></html>
